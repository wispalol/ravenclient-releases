plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'raven-client-title'
}

dependencies {
	// Minecraft itself + official Mojang mappings (remapped by Loom).
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// 26.x class files require Java 25+; 1.21.x run on Java 21.
	def mc = project.minecraft_version
	it.options.release = (mc.startsWith("1.21.") ? 21 : 25)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Copies the final remapped mod jar into the launcher's resources so the Maven
// build can bundle it into the game. Run once after building:
//     gradlew.bat build copyToLauncher
tasks.register('copyToLauncher', Copy) {
	dependsOn tasks.named('remapJar')
	from tasks.named('remapJar').flatMap { it.archiveFile }
	into file(rootProject.file('../src/main/resources'))
	rename { "raven-client-title-${project.minecraft_version}.jar" }
}
